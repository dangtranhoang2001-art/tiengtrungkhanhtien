<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Khánh Tiên – Giáo viên</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233B82F6'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>K</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=20261002j">
<style>
.qed{border-left:8px solid var(--sky)}
.qed[data-t=fill]{border-left-color:var(--jade)} .qed[data-t=order]{border-left-color:var(--sun)}
.qed[data-t=short]{border-left-color:#8E5CD9} .qed[data-t=essay]{border-left-color:var(--lantern)}
.optrow{display:flex;gap:8px;align-items:center;margin:4px 0}
.optrow input[type=radio]{width:22px;height:22px}
.code{font-size:34px;font-weight:800;letter-spacing:6px;color:var(--lantern)}
.split{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:14px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.subitem{display:block;width:100%;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.subitem.on{border-color:var(--sky)}
</style>
</head>
<body>
<header class="topbar"><div class="top">
  <div class="brand"><img src="/logo.png" alt="Khánh Tiên Chinese Education Center"><span class="sep" aria-hidden="true"></span><span><span class="ai wave" aria-hidden="true">🧑‍🏫</span> Khu vực giáo viên<small id="whoami"></small></span></div>
  <div class="row"><button class="btn ghost sm hide" id="swgv">🔄 Đổi giáo viên</button><button class="btn ghost sm hide" id="chpw2">🔑 Đổi mật khẩu</button><button class="btn ghost sm hide" id="logout">Đăng xuất</button></div>
</div></header>
<main class="wrap">
  <section id="vLogin" class="card" style="max-width:420px;margin:24px auto">
    <h1><span class="ai wave" aria-hidden="true">🐼</span> Đăng nhập giáo viên</h1>
    <label class="f" for="un">Tên đăng nhập</label>
    <input class="i" id="un" autocomplete="username" placeholder="VD: khanhtien" autocapitalize="none">
    <label class="f" for="pw">Mật khẩu</label>
    <input class="i" type="password" id="pw" autocomplete="current-password">
    <div class="err hide" id="lErr"></div>
    <button class="btn" id="lBtn" style="width:100%;margin-top:12px">Đăng nhập</button>
    <p style="text-align:center;margin:12px 0 0"><button class="linkbtn" id="forgot" type="button">Quên mật khẩu?</button></p>
  </section>

  <section id="vApp" class="hide">
    <div id="aiBanner"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="tClass" aria-selected="true"><span class="ai bounce" aria-hidden="true">🏫</span> Lớp học</button>
      <button role="tab" data-tab="tExam"><span class="ai wiggle" aria-hidden="true">📝</span> Đề bài</button>
      <button role="tab" data-tab="tGrade"><span class="ai pulse" aria-hidden="true">✅</span> Chấm bài</button>
      <button role="tab" data-tab="tProg"><span class="ai bounce" aria-hidden="true">📈</span> Tiến độ</button>
      <button role="tab" data-tab="tMng"><span class="ai bounce" aria-hidden="true">📋</span> Quản lý lớp</button>
      <button role="tab" data-tab="tTeach" class="hide" id="tabTeach"><span class="ai wave" aria-hidden="true">🧑‍🏫</span> Danh sách GV</button>
    </nav>

    <div id="tClass">
      <div class="card"><h3><span class="ai bounce" aria-hidden="true">✨</span> Tạo lớp mới</h3>
        <div class="row" style="align-items:flex-end">
          <div class="grow" style="min-width:200px"><label class="f">📁 Tên lớp</label><input class="i" id="cName" placeholder="VD: YCT5 – Thứ 3, 5"></div>
          <div class="grow" style="min-width:170px"><label class="f">🎧 GV Nghe + Nói</label><input class="i" id="cNN" placeholder="VD: Cô Thu Hà"></div>
          <div class="grow" style="min-width:170px"><label class="f">📖 GV Đọc + Viết</label><input class="i" id="cDV" placeholder="VD: Thầy Nam"></div>
          <button class="btn" id="cAdd">Tạo lớp</button></div><select class="hide" id="cOwner"></select>
      </div>
      <div class="row" style="margin:4px 0 10px"><input class="i" id="cSearch" placeholder="🔍 Tìm lớp theo tên, mã lớp hoặc tên giáo viên…" style="flex:1"><span class="small muted" id="cCount"></span></div>
      <div id="cList"></div>
    </div>

    <div id="tExam" class="hide">
      <div id="exList"></div>
      <div id="exEdit" class="hide"></div>
    </div>

    <div id="tGrade" class="hide">
      <div class="card row"><label class="f" for="gExam" style="margin:0">Chọn đề</label><select class="i grow" id="gExam" style="flex:1"></select><button class="btn ghost sm" id="gRef">Tải lại</button></div>
      <div class="split"><div id="gSubs"></div><div id="gDetail"></div></div>
    </div>

    <div id="tTeach" class="hide">
      <div class="card"><h3><span class="ai bounce" aria-hidden="true">➕</span> Thêm giáo viên</h3>
        <p class="small muted" style="margin:0 0 6px">Cả trung tâm dùng chung một tài khoản đăng nhập. Mỗi giáo viên chỉ cần chọn tên mình để vào khu vực lớp riêng.</p>
        <div class="row"><input class="i grow" id="nName" placeholder="VD: Cô Thu Hà" style="flex:1;min-width:200px"><button class="btn" id="nAdd">Thêm</button></div></div>
      <div id="teachList"></div>
    </div>
    <div id="tMng" class="hide">
      <div class="card row"><input class="i" id="mSearch" placeholder="🔍 Tìm lớp: tên, mã lớp, giáo viên…" style="flex:1;min-width:200px"><select class="i grow" id="mClass" style="flex:1;min-width:200px"></select><button class="btn ghost sm" id="mRef">Tải lại</button></div>
      <div id="mBody"></div>
    </div>
    <div id="tProg" class="hide">
      <div class="card row"><label class="f" for="pClass" style="margin:0">Chọn lớp</label><select class="i grow" id="pClass" style="flex:1"></select><select class="i" id="pSec" style="width:auto"><option value="">Tất cả phân môn</option></select><button class="btn ghost sm" id="pCsv">Tải bảng điểm (CSV)</button></div>
      <div id="pBody"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2800)}
let TOK=""; try{TOK=localStorage.getItem("kt_tok")||""}catch(e){}
async function api(path,opt={}){
  const r=await fetch(path,{method:opt.method||(opt.body?"POST":"GET"),headers:{"content-type":"application/json","authorization":"Bearer "+TOK},body:opt.body?JSON.stringify(opt.body):undefined});
  const d=await r.json().catch(()=>({error:"Máy chủ không phản hồi đúng."}));
  if(r.status===401&&!path.endsWith("/login")){logout();throw new Error(d.error)}
  if(!r.ok) throw new Error(d.error||"Có lỗi xảy ra.");
  return d;
}
const fmt=iso=>iso?new Date(iso).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit",year:"numeric"}):"—";
const toLocalInput=iso=>{if(!iso)return"";const d=new Date(iso);const p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
const pctColor=p=>p==null?"":p>=80?"background:var(--ok-bg);color:var(--jade)":p>=50?"background:var(--warn-bg)":"background:var(--bad-bg);color:var(--lantern)";
const STATUS={doing:["Đang làm",""],done:["Đã chấm","ok"],waiting_ai:["Chờ GV chấm","bad"],ai_done:["Chờ GV chấm","bad"],waiting_teacher:["Chờ GV chấm","bad"],reviewed:["Đã duyệt","ok"]};
const TYPE={mcq:"Trắc nghiệm",tf:"Đúng / Sai",fill:"Điền từ",listen:"🎧 Nghe chọn đáp án",tone:"〰️ Chọn thanh điệu",match:"🔗 Nối từ – nghĩa",order:"Sắp xếp câu",short:"Trả lời ngắn",speak:"🎤 Ghi âm đọc (ngữ âm)",upload:"📷 Nộp ảnh / tệp",essay:"Tự luận (GV chấm)"};
const TL={1:"Thanh 1",2:"Thanh 2",3:"Thanh 3",4:"Thanh 4",0:"Thanh nhẹ"};

/* ---------- Hộp thoại thông báo đẹp (thay hộp thoại mặc định của trình duyệt) ---------- */
function openDlg({icon="💬",title="",msg="",fields=[],ok="Đồng ý",cancel="Huỷ",danger=false}){
  return new Promise(res=>{
    const last=document.activeElement;
    const ov=document.createElement("div");ov.className="dlg-ov";
    ov.innerHTML=`<div class="dlg ${danger?"danger":""}" role="dialog" aria-modal="true" aria-labelledby="dlgT">
      <div class="dlg-ic" aria-hidden="true">${icon}</div>
      ${title?`<h3 id="dlgT">${esc(title)}</h3>`:""}<p ${title?"":'id="dlgT"'}>${esc(msg)}</p>
      ${fields.map((f,i)=>`<label class="f" for="dlgF${i}">${esc(f.label)}</label><input class="i" id="dlgF${i}" type="${f.type||"text"}" value="${esc(f.value||"")}" autocomplete="${f.type==="password"?"new-password":"off"}">`).join("")}
      <div class="dlg-err hide" id="dlgErr"></div>
      <div class="dlg-btns">${cancel?`<button class="btn ghost" data-v="0">${esc(cancel)}</button>`:""}<button class="btn ${danger?"red":""}" data-v="1">${esc(ok)}</button></div></div>`;
    document.body.appendChild(ov);
    const inputs=[...ov.querySelectorAll("input")];
    const done=v=>{ov.classList.add("out");setTimeout(()=>ov.remove(),180);document.removeEventListener("keydown",key);if(last&&last.focus)last.focus();res(v)};
    const submit=()=>{ if(!fields.length) return done(true);
      const vals=inputs.map(i=>i.value); const bad=fields.findIndex((f,i)=>f.required!==false&&!vals[i].trim());
      if(bad>=0){const e=ov.querySelector("#dlgErr");e.textContent="Vui lòng nhập "+fields[bad].label.toLowerCase();e.classList.remove("hide");inputs[bad].focus();return}
      done(vals) };
    ov.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>b.dataset.v==="1"?submit():done(fields.length?null:false));
    ov.addEventListener("click",e=>{if(e.target===ov&&cancel)done(fields.length?null:false)});
    function key(e){if(e.key==="Escape"&&cancel)done(fields.length?null:false);if(e.key==="Enter"&&(!fields.length||e.target.tagName==="INPUT")){e.preventDefault();submit()}
      if(e.key==="Tab"){const f=[...ov.querySelectorAll("button,input")];const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}}
    document.addEventListener("keydown",key);
    (inputs[0]||ov.querySelector('[data-v="1"]')).focus();
  });
}
const askConfirm=(msg,o={})=>openDlg({icon:"🤔",ok:"Đồng ý",...o,msg});
const tell=(msg,o={})=>openDlg({icon:"📢",ok:"Đã hiểu",cancel:"",...o,msg});

/* ---------- Đăng nhập ---------- */
function logout(){TOK="";try{localStorage.removeItem("kt_tok")}catch(e){};$("vApp").classList.add("hide");$("vLogin").classList.remove("hide");$("logout").classList.add("hide");$("swgv").classList.add("hide");$("chpw2").classList.add("hide");$("whoami").textContent=""}
$("logout").onclick=logout;
$("lBtn").onclick=async()=>{$("lErr").classList.add("hide");
  try{const d=await api("/api/login",{body:{username:$("un").value.trim(),password:$("pw").value}});TOK=d.token;try{localStorage.setItem("kt_tok",TOK)}catch(e){};$("pw").value="";await boot()}
  catch(e){$("lErr").textContent=e.message;$("lErr").classList.remove("hide")}};
$("forgot").onclick=async()=>{
  let info; try{info=await api("/api/forgot")}catch(e){return toast(e.message)}
  if(!info.mailReady) return tell("Chức năng gửi mã qua email chưa được bật. Quản trị cần cài RESEND_API_KEY trên Netlify, hoặc liên hệ dangtranhoang2001@gmail.com.",{icon:"📭",title:"Chưa bật gửi email"});
  if(!(await askConfirm(`Hệ thống sẽ gửi mã xác nhận 6 số đến email ${info.email}.`,{icon:"📧",title:"Quên mật khẩu",ok:"Gửi mã"}))) return;
  try{await api("/api/forgot",{body:{}})}catch(e){ if(!/Vừa gửi mã/.test(e.message)) return toast(e.message); toast(e.message) }
  for(;;){
    const v=await openDlg({icon:"🔐",title:"Nhập mã xác nhận",msg:`Mã đã gửi đến ${info.email} (hiệu lực 15 phút). Kiểm tra cả hộp thư Spam.`,
      fields:[{label:"Mã 6 số"},{label:"Mật khẩu mới",type:"password"},{label:"Nhập lại mật khẩu mới",type:"password"}],ok:"Đặt lại mật khẩu"});
    if(!v) return;
    if(v[1]!==v[2]){await tell("Hai mật khẩu mới không giống nhau.",{icon:"⚠️"});continue}
    try{await api("/api/reset",{body:{code:v[0],newPassword:v[1]}});await tell("Đã đặt lại mật khẩu. Thầy/cô đăng nhập bằng mật khẩu mới nhé.",{icon:"✅",title:"Thành công"});$("pw").focus();return}
    catch(e){await tell(e.message,{icon:"⚠️",title:"Chưa đặt lại được"}); if(/hết hạn|gửi mã mới/.test(e.message)) return;}
  }
};
$("chpw2").onclick=async()=>{const v=await openDlg({icon:"🔑",title:"Đổi mật khẩu",msg:"Mật khẩu chung của trung tâm. Mật khẩu mới cần từ 6 ký tự.",fields:[{label:"Mật khẩu hiện tại",type:"password"},{label:"Mật khẩu mới",type:"password"},{label:"Nhập lại mật khẩu mới",type:"password"}],ok:"Đổi mật khẩu"});
  if(!v) return; if(v[1]!==v[2]) return tell("Hai mật khẩu mới không giống nhau.",{icon:"⚠️"});
  try{await api("/api/t/password",{body:{oldPassword:v[0],newPassword:v[1]}});tell("Đã đổi mật khẩu. Nhớ báo mật khẩu mới cho các giáo viên trong trung tâm.",{icon:"✅",title:"Thành công"})}catch(e){toast(e.message)}};

$("swgv").onclick=()=>pickProfile(true);
const _unused_chpw=async()=>{const v=await openDlg({icon:"🔑",title:"Đổi mật khẩu",msg:"Mật khẩu mới cần từ 6 ký tự.",fields:[{label:"Mật khẩu hiện tại",type:"password"},{label:"Mật khẩu mới",type:"password"}],ok:"Đổi mật khẩu"});if(!v)return;const [o,n]=v;
  try{await api("/api/t/password",{body:{oldPassword:o,newPassword:n}});toast("Đã đổi mật khẩu")}catch(e){toast(e.message)}};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("lBtn").click()});

let D={classes:[],exams:[],teachers:[],me:{},aiEnabled:false};
const isAdmin=()=>D.me.role==="admin";
let PROF="all";
const profOk=()=>PROF==="all"||D.teachers.some(t=>t.id===PROF)||PROF==="admin";
const profName=()=>PROF==="all"?"Tất cả giáo viên":PROF==="admin"?(D.me.name||"Quản trị"):(D.teachers.find(t=>t.id===PROF)||{}).name||"";
const myClasses=()=>PROF==="all"?D.classes:D.classes.filter(c=>(c.ownerId||"admin")===PROF);
const myExams=()=>{const codes=new Set(myClasses().map(c=>c.code));return D.exams.filter(e=>codes.has(e.classCode))};
function applyProfile(){
  $("whoami").textContent="Trung tâm Tiếng Trung Khánh Tiên";
  
  renderClasses();renderExamList();fillSelects();renderTeachers();
  const g=document.querySelector('[data-tab="tGrade"]'); if(g&&g.getAttribute("aria-selected")==="true") loadSubs();
  const pr=document.querySelector('[data-tab="tProg"]'); if(pr&&pr.getAttribute("aria-selected")==="true") loadProg();
}
function pickProfile(canCancel){
  return new Promise(res=>{
    const ov=document.createElement("div");ov.className="dlg-ov";
    const list=[{id:"admin",name:D.me.name||"Quản trị"},...D.teachers];
    ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ppT" style="max-width:480px">
      <div class="dlg-ic" aria-hidden="true"><span class="ai wave">🧑‍🏫</span></div><h3 id="ppT">Thầy/cô là ai?</h3>
      <p>Chọn tên để vào khu vực lớp của mình. Máy này sẽ nhớ lựa chọn.</p>
      <div class="pp-list">${list.map(t=>`<button class="pp ${t.id===PROF?"on":""}" data-p="${esc(t.id)}"><span class="pp-av">${esc((t.name.trim().split(/\s+/).pop()||"?")[0].toUpperCase())}</span>${esc(t.name)}</button>`).join("")}</div>
      <button class="pp all ${PROF==="all"?"on":""}" data-p="all">👀 Xem tất cả lớp của trung tâm</button>
      <div class="row" style="margin-top:12px"><input class="i grow" id="ppNew" placeholder="Chưa có tên? Nhập tên mới, VD: Cô Thu Hà" style="flex:1"><button class="btn sm" id="ppAdd">Thêm</button></div>
      ${canCancel?`<div class="dlg-btns"><button class="btn ghost" id="ppX">Đóng</button></div>`:""}</div>`;
    document.body.appendChild(ov);
    const choose=id=>{PROF=id;try{localStorage.setItem("kt_gv",id)}catch(e){};ov.remove();applyProfile();res(id)};
    ov.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>choose(b.dataset.p));
    ov.querySelector("#ppAdd").onclick=async()=>{const n=ov.querySelector("#ppNew").value.trim();if(!n)return ov.querySelector("#ppNew").focus();
      try{const t=await api("/api/t/teacher",{body:{name:n}});D.teachers.push(t);choose(t.id);toast("Đã thêm "+t.name)}catch(e){toast(e.message)}};
    ov.querySelector("#ppNew").addEventListener("keydown",e=>{if(e.key==="Enter")ov.querySelector("#ppAdd").click()});
    if(canCancel){ov.querySelector("#ppX").onclick=()=>{ov.remove();res(null)};ov.addEventListener("click",e=>{if(e.target===ov){ov.remove();res(null)}})}
    (ov.querySelector(".pp.on")||ov.querySelector(".pp")).focus();
  });
}
const teacherName=id=>!id||id==="admin"?(isAdmin()?D.me.name:"Quản trị"):(D.teachers.find(t=>t.id===id)||{}).name||id;
async function boot(){
  D=await api("/api/t/overview");
  $("vLogin").classList.add("hide");$("vApp").classList.remove("hide");$("logout").classList.remove("hide");$("chpw2").classList.remove("hide");
  $("cOwner").innerHTML=`<option value="admin">${esc(D.me.name||"Quản trị")}</option>`+D.teachers.filter(t=>!t.disabled).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  $("aiBanner").innerHTML="";
  applyProfile();
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["tClass","tExam","tGrade","tProg","tTeach","tMng"].forEach(t=>$(t).classList.toggle("hide",t!==b.dataset.tab));
  if(b.dataset.tab==="tGrade")loadSubs(); if(b.dataset.tab==="tMng"){fillMngSelect();loadMng()} if(b.dataset.tab==="tProg")loadProg();
});
const className=c=>(D.classes.find(x=>x.code===c)||{}).name||c;
const DEF_SECS=()=>[{id:"nn",name:"Nghe + Nói",teacher:""},{id:"dv",name:"Đọc + Viết",teacher:""}];
const secsOf=c=>c&&Array.isArray(c.sections)&&c.sections.length?c.sections:DEF_SECS();
const secIcon=n=>/nghe|nói/i.test(n)?"🎧":/đọc|viết/i.test(n)?"📖":"📂";
const secOfExam=e=>{const c=D.classes.find(x=>x.code===e.classCode);const ss=secsOf(c);return ss.find(x=>x.id===e.sectionId)||ss[0]};
const secLabel=e=>{const x=secOfExam(e);return x?`${secIcon(x.name)} ${x.name}${x.teacher?` (${x.teacher})`:""}`:""};
function showTab(id){document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===id));["tClass","tExam","tGrade","tProg","tTeach","tMng"].forEach(t=>$(t).classList.toggle("hide",t!==id));scrollTo(0,0)}
function fillSelects(){
  const ex=$("gExam").value, cl=$("pClass").value;

/* ---------- Quản lý lớp: điểm danh · hoàn thành bài tập · đánh giá ---------- */
const norm=t=>String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/gi,"d").toLowerCase();
const slugify=t=>norm(t).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const classMatch=(c,q)=>{if(!q)return true;const h=norm([c.name,c.code,...secsOf(c).map(x=>x.name+" "+x.teacher)].join(" "));return norm(q).split(/\s+/).every(w=>h.includes(w))};
const ATT={P:["✅","Có mặt","ok"],L:["⏰","Đi muộn","warn"],E:["📝","Vắng có phép",""],A:["❌","Vắng","bad"]};
let M=null, MV="att";

  const q=$("mSearch").value, cur=$("mClass").value;

}
async function loadMng(){
  const code=$("mClass").value; if(!code){$("mBody").innerHTML="";return}
  try{M=await api("/api/t/manage?classCode="+code);M.code=code;renderMng()}catch(e){toast(e.message)}
}
function mStudents(){ // danh sách cố định + học viên đã từng nộp bài
  const map=new Map(M.roster.map(s=>[s.id,{id:s.id,name:s.name,inRoster:true}]));
  for(const [id,n] of Object.entries(M.names)) if(!map.has(id)) map.set(id,{id,name:n,inRoster:false});
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,"vi"));
}
function mStats(st){
  const ss=M.sessions; let pts=0,den=0,abs=0,late=0,exc=0;
  for(const s of ss){const v=s.records[st.id]; if(!v) continue; if(v==="E"){exc++;continue} den++; if(v==="P")pts+=1; else if(v==="L"){pts+=.75;late++} else abs++;}
  const cc=den?Math.round(pts/den*100):null;
  const assigned=M.exams.filter(e=>e.started); const r=M.results[st.id]||{};
  const done=assigned.filter(e=>r[e.id]&&r[e.id].status!=="doing").length;
  const ht=assigned.length?Math.round(done/assigned.length*100):null;
  const sc=assigned.map(e=>r[e.id]).filter(x=>x&&x.graded&&x.pct!=null).map(x=>x.pct);
  const avg=sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;
  const parts=[[cc,.3],[ht,.3],[avg,.4]].filter(x=>x[0]!=null); const w=parts.reduce((a,x)=>a+x[1],0);
  const total=w?Math.round(parts.reduce((a,x)=>a+x[0]*x[1],0)/w):null;
  const rank=total==null?["—",""]:total>=85?["🌟 Tốt","ok"]:total>=70?["👍 Khá","ok"]:total>=50?["🙂 Trung bình","warn"]:["⚠️ Cần cố gắng","bad"];
  const flags=[]; if(abs>=2) flags.push(`vắng ${abs} buổi`); const miss=assigned.length-done; if(miss>=2) flags.push(`chưa làm ${miss} bài`); if(avg!=null&&avg<50) flags.push("điểm thấp");
  return {cc,attended:den-abs,den,abs,late,exc,ht,done,assigned:assigned.length,avg,total,rank,flags};
}

function renderSum(){
  const st=mStudents(); if(!st.length){$("mView").innerHTML=`<div class="card">Lớp chưa có học viên.</div>`;return}
  const rows=st.map(s=>({s,...mStats(s)}));
  const avg=(k)=>{const v=rows.map(r=>r[k]).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
  const bar=(v)=>v==null?`<span class="muted">—</span>`:`<div class="minibar"><i style="width:${v}%;background:${v>=80?"var(--jade)":v>=50?"var(--sun)":"var(--coral)"}"></i></div><b>${v}%</b>`;
  $("mView").innerHTML=`<div class="statgrid">
      <div class="stat"><span class="ai bounce">✅</span><b>${avg("cc")??"—"}${avg("cc")!=null?"%":""}</b><small>Chuyên cần TB · ${M.sessions.length} buổi</small></div>
      <div class="stat"><span class="ai bounce">📝</span><b>${avg("ht")??"—"}${avg("ht")!=null?"%":""}</b><small>Hoàn thành bài tập · ${M.exams.filter(e=>e.started).length} bài đã giao</small></div>
      <div class="stat"><span class="ai bounce">🎯</span><b>${avg("avg")??"—"}${avg("avg")!=null?"%":""}</b><small>Điểm trung bình</small></div>
      <div class="stat"><span class="ai bounce">⚠️</span><b>${rows.filter(r=>r.flags.length).length}</b><small>Học viên cần chú ý</small></div></div>
    <div class="card tablewrap"><div class="row"><h3 class="grow" style="margin:0">Đánh giá quá trình học</h3><button class="btn ghost sm" id="sCsv">⬇ Tải Excel (CSV)</button></div>
    <table><thead><tr><th>Học viên</th><th>Chuyên cần</th><th>Hoàn thành BT</th><th>Điểm TB</th><th>Tổng hợp</th><th>Đánh giá</th><th>Cần chú ý</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><th>${esc(r.s.name)}</th><td>${bar(r.cc)}<div class="small muted">${r.den?`${r.attended}/${r.den} buổi${r.late?` · ${r.late} muộn`:""}${r.exc?` · ${r.exc} có phép`:""}`:"chưa điểm danh"}</div></td>
      <td>${bar(r.ht)}<div class="small muted">${r.done}/${r.assigned} bài</div></td><td>${bar(r.avg)}</td><td><b>${r.total??"—"}</b></td>
      <td><span class="tag ${r.rank[1]}">${r.rank[0]}</span></td><td class="small">${r.flags.map(f=>`<span class="tag bad" style="margin:1px">${f}</span>`).join(" ")||"—"}</td></tr>`).join("")}</tbody></table>
    <p class="small muted">Cách tính: Tổng hợp = 30% chuyên cần + 30% hoàn thành bài tập + 40% điểm trung bình (mục chưa có dữ liệu sẽ bỏ qua).
      Chuyên cần: có mặt = 1, đi muộn = 0,75, vắng = 0, vắng có phép không tính. Xếp loại: ≥85 Tốt · ≥70 Khá · ≥50 Trung bình · dưới 50 Cần cố gắng.</p></div>`;
  $("sCsv").onclick=()=>{const L=[["Học viên","Chuyên cần %","Số buổi có mặt","Số buổi vắng","Hoàn thành BT %","Số bài đã làm","Điểm TB %","Tổng hợp","Đánh giá","Cần chú ý"],

/* ---------- Nhập đề ---------- */
function parseImport(txt){
  let d; try{d=JSON.parse(String(txt).trim().replace(/^\uFEFF/,""))}catch(e){throw new Error("Nội dung không đúng định dạng đề. Hãy dán nguyên văn, không sửa dấu ngoặc.")}
  if(!d||!Array.isArray(d.questions)||!d.questions.length) throw new Error("Không thấy danh sách câu hỏi (questions).");
  const qs=d.questions.map((q,i)=>{
    const n=`Câu ${i+1}: `;
    if(!TYPE[q.type]) throw new Error(n+"dạng câu không hợp lệ ("+q.type+").");
    const b={...blankQ(q.type),...q,points:Number(q.points)||1};
    if(b.type==="tf") b.type="mcq";
    delete b.id;
    if((b.type==="mcq"||b.type==="fill")&&(!Array.isArray(b.options)||b.options.length<2)) throw new Error(n+"cần ít nhất 2 phương án.");
    if((b.type==="mcq"||b.type==="fill")&&!(b.correct>=0&&b.correct<b.options.length)) throw new Error(n+"đáp án đúng (correct) phải là số thứ tự phương án, bắt đầu từ 0.");
    return b;
  });
  const tg=IMPORT_TARGET;IMPORT_TARGET=null;
  return{title:String(d.title||"Đề nhập từ file"),classCode:tg?tg.code:(myClasses()[0]?.code||""),sectionId:tg?tg.sec:undefined,durationMin:Number(d.durationMin)||15,
    published:false,showAnswers:d.showAnswers!==false,showAI:!!d.showAI,questions:qs};
}

function validate(){
  if(!E.title) return "Đề chưa có tên.";
  if(!E.classCode) return "Chưa chọn lớp.";
  if(!E.questions.length) return "Đề chưa có câu hỏi.";
  if(E.openAt&&E.dueAt&&E.dueAt<=E.openAt) return "Hạn nộp phải sau thời điểm mở.";
  for(const [i,q] of E.questions.entries()){
    const n=`Câu ${i+1}: `;
    if(!q.prompt.trim()) return n+"chưa có đề bài.";
    if((q.type==="mcq"||q.type==="fill"||q.type==="listen")&&q.options.some(o=>!String(o).trim())) return n+"còn phương án trống.";
    if(q.type==="listen"&&!q.audioKey&&!(q.audioText||"").trim()) return n+"chưa có âm thanh bài nghe.";
    if(q.type==="tone"&&!(q.items||[]).length) return n+"chưa có chữ nào (mỗi dòng: chữ pinyin số_thanh).";
    if(q.type==="match"&&(q.pairs||[]).length<2) return n+"cần ít nhất 2 cặp (mỗi dòng: trái = phải).";
    if(q.type==="match"&&new Set(q.pairs.map(p=>p.right)).size<q.pairs.length) return n+"các vế phải không được trùng nhau.";
    if(q.type==="speak"&&!(q.text||"").trim()) return n+"chưa có nội dung cần đọc.";
    if(q.type==="fill"&&!q.prompt.includes("＿")) return n+"chưa có dấu ＿＿＿ cho chỗ trống.";
    if(q.type==="order"&&q.chunks.length<2) return n+"cần ít nhất 2 thẻ.";
    if(q.type==="short"&&!q.answers.length) return n+"chưa có đáp án.";
  }
  return "";
}

function spark(vals){
  const v=vals.filter(x=>x!=null); if(v.length<2) return "";
  const w=90,h=26,step=w/(v.length-1);
  const pts=v.map((x,i)=>`${(i*step).toFixed(1)},${(h-2-x/100*(h-4)).toFixed(1)}`).join(" ");
  const up=v[v.length-1]>=v[0];
  return `<svg width="${w}" height="${h}" role="img" aria-label="Xu hướng ${up?"tăng":"giảm"}"><polyline points="${pts}" fill="none" stroke="${up?"#14A37F":"#E8453C"}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

  const firstSec=(P.sections||[])[0]?.id;
  const ex=P.exams.filter(e=>!sv||(e.sectionId||firstSec)===sv);
  if(!P.students.length){$("pBody").innerHTML=`<p class="muted">Lớp chưa có bài nộp nào.</p>`;return}

    const vals=ex.map(e=>s.results[e.id]?.pct??null); const got=vals.filter(v=>v!=null);
    s.avg=got.length?Math.round(got.reduce((a,b)=>a+b,0)/got.length):null; s.done=got.length;
    const rep=P.reports.find(r=>r.studentId===s.id);
    return`<tr><th>${esc(s.name)}</th>${vals.map((v,k)=>`<td>${v==null?`<span class="muted">—</span>`:`<span class="pct" style="${pctColor(v)}" title="${esc(ex[k].title)}">${v}%</span>${s.results[ex[k].id].late?" ⏰":""}`}</td>`).join("")}
      <td><b>${s.avg??"—"}${s.avg!=null?"%":""}</b></td><td>${s.done}/${ex.length}</td><td>${spark(vals)}</td>
</tr>`;
  }).join("");
  const classAvg=Math.round(P.students.filter(s=>s.avg!=null).reduce((a,s)=>a+s.avg,0)/Math.max(1,P.students.filter(s=>s.avg!=null).length));
  $("pBody").innerHTML=`<div class="card row"><div class="grow"><b>${P.students.length}</b> học sinh · <b>${ex.length}</b> bài đã giao · Điểm trung bình lớp: <span class="pct" style="${pctColor(classAvg)}">${classAvg}%</span></div></div>
    <div class="card tablewrap"><table><thead><tr><th>Học sinh</th>${ex.map((e,i)=>`<th title="${esc(e.title)}">Bài ${i+1}</th>`).join("")}<th>TB</th><th>Đã làm</th><th>Xu hướng</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="small muted">${ex.map((e,i)=>`Bài ${i+1}: ${esc(e.title)}`).join(" · ")} · ⏰ = nộp muộn</p></div>
    ${P.hard.length?`<div class="card"><h3>Câu cả lớp sai nhiều (≥ 50%)</h3><table><tr><th>Câu</th><th>Bài</th><th>Tỉ lệ sai</th></tr>${P.hard.map(h=>`<tr><td class="zh">${esc(h.prompt)}</td><td>${esc(h.exam)}</td><td><span class="pct" style="${pctColor(100-Math.round(h.wrong/h.total*100))}">${h.wrong}/${h.total}</span></td></tr>`).join("")}</table></div>`:""}
    <div id="pRep"></div>`;
}
async function openReport(sid){
  const s=P.students.find(x=>x.id===sid); const rep=P.reports.find(r=>r.studentId===sid);
  const show=r=>{
    const box=$("pRep");
    if(!r){box.innerHTML="";return}
    if(r.status==="working"){box.innerHTML=`<div class="card">🤖 AI đang viết nhận xét cho ${esc(s.name)}…</div>`;return}
    if(r.status==="error"){box.innerHTML=`<div class="card err">Chưa viết được nhận xét: ${esc(r.error)}</div>`;return}
    const R=r.report, li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
    box.innerHTML=`<div class="card"><div class="row"><h3 class="grow">Nhận xét tiến độ: ${esc(s.name)}</h3><button class="btn ghost sm" id="rNew">Viết lại</button></div>
      <p class="small muted">Dựa trên ${r.basedOn} bài · ${fmt(r.at)} · Do AI viết, giáo viên kiểm tra trước khi dùng.</p>
      <p><b>Xu hướng:</b> ${esc(R.xu_huong)}</p>
      <div class="row" style="align-items:flex-start"><div class="grow"><b>Điểm mạnh</b><ul>${li(R.diem_manh)}</ul></div><div class="grow"><b>Cần cải thiện</b><ul>${li(R.can_cai_thien)}</ul></div></div>
      ${R.loi_lap_lai?.length?`<b>Lỗi lặp lại</b><ul>${li(R.loi_lap_lai)}</ul>`:""}
      <b>Gợi ý luyện tập</b><ul>${li(R.goi_y)}</ul>
      <div class="card" style="background:var(--bg)"><b>Lời nhắn cho học sinh:</b> ${esc(R.loi_nhan_cho_hs)}</div></div>`;
    $("rNew").onclick=()=>gen();
  };
  const gen=async()=>{
    try{await api("/api/t/report",{body:{classCode:$("pClass").value,studentId:sid}});}catch(e){return toast(e.message)}
    show({status:"working"});
    for(let t=0;t<25;t++){await new Promise(r=>setTimeout(r,3000));
      const d=await api("/api/t/progress?classCode="+$("pClass").value).catch(()=>null); if(!d) continue;
      const r=d.reports.find(x=>x.studentId===sid); if(r&&r.status!=="working"){P=d;renderProg();show(r);$("pRep").scrollIntoView({behavior:"smooth"});return}}
    $("pRep").innerHTML=`<div class="card">AI vẫn đang viết, thầy/cô quay lại tab Tiến độ sau ít phút.</div>`;
  };
  if(rep&&rep.status!=="working"){show(rep);$("pRep").scrollIntoView({behavior:"smooth"})} else gen();
}
$("pCsv").onclick=()=>{
  if(!P) return toast("Chọn lớp trước");
  const head=["Học sinh",...P.exams.map(e=>e.title),"Trung bình %"];
  const lines=[head,...P.students.map(s=>[s.name,...P.exams.map(e=>s.results[e.id]?`${s.results[e.id].score}/${s.results[e.id].max}`:""),s.avg??""])];
  const csv="\ufeff"+lines.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`bang-diem-${$("pClass").value}.csv`;a.click();
};

if(TOK) boot().catch(()=>logout());
</script>
